name: CI

on:
  push:
  pull_request:

jobs:
  metadata:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project metadata
        run: python3 scripts/check_project.py
      - name: Compile Python sources
        run: python3 -m py_compile scripts/*.py tests/*.py
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --python 3.12
      - name: Run evaluator tests
        run: uv run python -m unittest discover -s tests
