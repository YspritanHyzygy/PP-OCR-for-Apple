name: Build and publish model release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pack version already committed in the selected recipe
        required: true
        default: "2"
      recipe:
        description: Committed release recipe
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked conversion environment
        run: uv sync --locked --python 3.12
      - name: Refuse a mismatched version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RECIPE: ${{ inputs.recipe }}
        run: |
          ACTUAL_VERSION=$(python3 -c 'import json, os; print(json.load(open(os.environ["RECIPE"]))["packVersion"])')
          test "$ACTUAL_VERSION" = "$REQUESTED_VERSION"
      - name: Require complete corpus and release metadata
        run: >-
          python3 scripts/check_project.py
          --recipe "${{ inputs.recipe }}"
          --require-release-ready
      - name: Build all pinned tiers
        run: >-
          uv run python scripts/build_models.py
          --recipe "${{ inputs.recipe }}"
          --out dist
      - name: Validate release metadata and assets
        run: >-
          python3 scripts/check_project.py
          --recipe "${{ inputs.recipe }}"
          --manifest dist/manifest.json
          --assets dist
          --require-release-ready
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v${VERSION}"
          dist/pp-ocr-v6-coreml-*-v${VERSION}.aar
          dist/manifest.json
          dist/SHA256SUMS
          --title "PP-OCRv6 Core ML packages v${VERSION}"
          --generate-notes
