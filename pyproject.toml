[project]
name = "pp-ocr-for-apple"
version = "0.1.0"
description = "Reproducible PP-OCRv6 conversion and packaging for Core ML on Apple platforms"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "coremltools==9.0",
    "fastapi>=0.116,<1",
    "google-auth>=2.40,<3",
    "huggingface-hub>=0.36,<2",
    "httpx>=0.28,<1",
    "numpy>=1.26,<3",
    "onnx==1.17.0",
    "onnx2torch==1.5.15",
    "onnxruntime==1.28.0",
    "pillow==12.3.0",
    "pytest>=8.4,<10",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "regex>=2026.7,<2027",
    "scikit-learn==1.5.1",
    "scipy>=1.17,<2",
    "shapely>=2.1,<3",
    "torch==2.7.0",
    "uvicorn>=0.35,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
